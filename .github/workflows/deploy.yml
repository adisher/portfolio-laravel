name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Hostinger's SSH port sometimes drops connections for a minute or two
      # (seen as "dial tcp ...: i/o timeout"). Wait for it to answer before
      # deploying instead of failing the run on a blip.
      - name: Wait for the server's SSH port
        run: |
          for attempt in $(seq 1 10); do
            if timeout 10 bash -c 'echo > /dev/tcp/185.212.70.29/65002' 2>/dev/null; then
              echo "SSH port reachable (attempt $attempt)"
              exit 0
            fi
            echo "SSH port not reachable yet (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "SSH port still unreachable, trying the deploy anyway"

      - name: Deploy to Hostinger
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.212.70.29
          port: 65002
          username: u109241241
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            set -e
            cd /home/u109241241/domains/adilsher.pro/portfolio-laravel
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      # One retry after a pause. Every deploy step is safe to run twice
      # (reset to main, install, migrate, rebuild caches).
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Hostinger (retry)
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.212.70.29
          port: 65002
          username: u109241241
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            set -e
            cd /home/u109241241/domains/adilsher.pro/portfolio-laravel
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
